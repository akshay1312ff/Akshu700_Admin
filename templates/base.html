<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CineVault{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><header><a class="brand" href="{{url_for('home')}}">Cine<span>Vault</span></a><form class="search" action="{{url_for('home')}}"><input name="q" value="{{q|default('')}}" placeholder="Search movies..."><button>Search</button></form><a class="admin-link" href="{{url_for('admin')}}">Admin</a></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<main>{% block content %}{% endblock %}</main><footer>© 2026 CineVault · Authorized content only</footer></body></html>
