{% extends 'base.html' %}{% block title %}Add Movie — CineVault{% endblock %}{% block content %}<div class="form-page"><h1>Add Movie</h1><form method="post" enctype="multipart/form-data" class="movie-form"><label>Title<input name="title" required></label><label>Year<input name="year" type="number" min="1888" max="2100"></label><label>Language<input name="language" value="Hindi"></label><label>Genre<input name="genre" placeholder="Action, Drama"></label><label>Quality<input name="quality" placeholder="1080p / 720p"></label><label>Size<input name="size" placeholder="2.1 GB"></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Poster <input type="file" name="poster" accept="image/*"></label><label>Movie file <input type="file" name="movie_file" accept="video/*,.mkv"></label><label class="check"><input type="checkbox" name="published" checked> Publish immediately</label><button class="btn">Upload Movie</button></form></div>{% endblock %}
